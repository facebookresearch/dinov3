encoder:
  # name: 'Fossil' 
  # weight_path: '/path/to/cluster_home/data/checkpoint/dino/fossil-datasetv4-512/ckpt/11999/consolidated_model/pytorch_model.bin'
  # config_path: 'dinov3/configs/train/dinov3_vitl16_geo.yaml' 
  # name: 'DINOv3'
  # config_path: '' 
  # weight_path: "facebook/dinov3-vitl16-pretrain-lvd1689m"
  name: 'DINOtxt'
  config_path: "/path/to/cluster_home/data/checkpoint/vlm-finetuning/NWPU-DINOtxt-global-large-LoRA-Seed-batch256-t25/config.yaml" 
  weight_path: ""
  average_patch: False
  size: [256, 512] # image size
decoder:
  # name: "Qwen/Qwen3-4B-Thinking-2507"
  # name: "Qwen/Qwen3-0.6B"
  name: "/path/to/cluster_home/data/checkpoint/finetuning/qwen3-0.6B/"
  lora_rank: 4
  lora_alpha : 32
  apply_lora: False
multimodal: 'mapper:20' # mapper:<k>, merger:<s>, projector, attention:<k>, qformer:<queries>[:<layers>[:<width>]]
scale_token: False # learned visual token with the physical scale of each image (needs data.scale_field)
train:
  batch_size: 16
  stage1:
    # train the multi modal bridge only
    learning_rate: 0.001
    epochs: 1
  stage2:
    # end to end train
    frozen_encoder: True
    learning_rate: 0.0002
    epochs: 4
data:
  groups: [2, 3]
  root: "/path/to/geo_images/"
  train: "/path/to/project_home/data/Dataset/v4/conv_train.json"
  val: "/path/to/project_home/data/Dataset/v4/conv_val.json"
  test: "/path/to/project_home/data/Dataset/v4/conv_test.json"
  small_root: null # folder with the non-standardized images (same file names as root); null: images from root
  scale_field: null # sample field with the scale of the loaded image (e.g. px_per_mm); null: no scale
  scale_unit: px_per_mm # unit of scale_field: px_per_mm, mm_per_px or um_per_px
save_path: "/path/to/cluster_home/data/checkpoints/fossil_vl"

# "facebook/dinov3-vitl16-pretrain-lvd1689m"
